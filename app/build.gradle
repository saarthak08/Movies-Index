plugins {
  alias libs.plugins.android.application
  alias libs.plugins.google.dagger.hilt.android
  alias libs.plugins.kotlin.parcelize
  alias libs.plugins.kotlin.ksp
  alias libs.plugins.spotless
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keys/key.properties')
if (keystorePropertiesFile.exists()) {
  keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
  namespace = 'com.sg.moviesindex'
  compileSdk = 37
  compileOptions {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
  }

  defaultConfig {
    applicationId = "com.sg.moviesindex"
    minSdk = 23
    multiDexEnabled = true
    targetSdk = 37
    versionCode = 19
    versionName = "2.0.0"
    testInstrumentationRunner = "com.sg.moviesindex.HiltTestRunner"

    ksp {
      arg("room.schemaLocation", layout.projectDirectory.dir("schemas").asFile.absolutePath)
    }
    buildConfigField "String", "ApiKey", (keystoreProperties['apiKey'] ?: '""')
  }

  sourceSets {
    named("androidTest") {
      assets.srcDirs += [layout.projectDirectory.dir("schemas")]
    }
  }

  signingConfigs {
    release {
      keyAlias = keystoreProperties['keyAlias']
      keyPassword = keystoreProperties['keyPassword']
      storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
      storePassword = keystoreProperties['storePassword']
    }
  }

  buildTypes {
    release {
      minifyEnabled = true
      shrinkResources = true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      signingConfig = signingConfigs.release
    }
  }

  flavorDimensions += ["env"]

  productFlavors {
    dev {
      dimension = "env"
      applicationIdSuffix = ".dev"
      versionNameSuffix = "-dev"
      buildConfigField "String", "FLAVOR", '"dev"'
      resValue "string", "app_name", "[DEV] Movies Index"
    }

    prod {
      dimension = "env"
      buildConfigField "String", "FLAVOR", '"prod"'
      resValue "string", "app_name", "Movies Index"
    }
  }

  buildFeatures {
    dataBinding = true
    buildConfig = true
    resValues = true
  }

  dependenciesInfo {
    includeInApk = false
    includeInBundle = false
  }
  
  testOptions {
    unitTests.all {
      useJUnitPlatform()
    }
  }
}

spotless {
  kotlin {
    target "**/*.kt"
    ktlint()
    trimTrailingWhitespace()
    endWithNewline()
  }
  format 'xml', {
    target "**/*.xml"
    trimTrailingWhitespace()
    endWithNewline()
  }
}

