name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

jobs:
  test:
    name: Format, Lint and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Create release key properties from secrets
        env:
          RELEASE_KEYSTORE_PROPERTIES: ${{ secrets.RELEASE_KEYSTORE_PROPERTIES }}
        run: |
          mkdir keys
          echo "${RELEASE_KEYSTORE_PROPERTIES}" > keys/key.properties
      - name: Run checks
        run: ./gradlew check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' || github.base_ref == 'master'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Create release key and release key properties from secrets
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          RELEASE_KEYSTORE_PROPERTIES: ${{ secrets.RELEASE_KEYSTORE_PROPERTIES }}
        run: |
          mkdir keys
          echo -n "${RELEASE_KEYSTORE}" | base64 -d > keys/upload-keystore.jks
          echo "${RELEASE_KEYSTORE_PROPERTIES}" > keys/key.properties
      - name: Set Flavor
        run: |
          if [ "${{ github.ref }}" == "refs/heads/dev" ]; then
            echo "FLAVOR=dev" >> $GITHUB_ENV
            echo "FLAVOR_CAP=Dev" >> $GITHUB_ENV
          else
            echo "FLAVOR=prod" >> $GITHUB_ENV
            echo "FLAVOR_CAP=Prod" >> $GITHUB_ENV
          fi
      - name: Run build
        run: ./gradlew bundle${{ env.FLAVOR_CAP }}Release
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: movies-index
          path: app/build/outputs/bundle/${{ env.FLAVOR }}Release/app-${{ env.FLAVOR }}-release.aab
          overwrite: true
          include-hidden-files: true

  deploy:
    name: Deploy to Play Store
    runs-on: ubuntu-latest
    needs: build
    environment: production
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: movies-index
          path: artifact
      - uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.sg.moviesindex
          releaseFiles: artifact/app-prod-release.aab
          track: internal

  create-release:
    name: Create Tag and Release
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
      - name: Get version from app/build.gradle
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*["'\'']\K[^"'\''\s]+' app/build.gradle | head -n 1)
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create tag
        run: |
          git tag ${{ steps.version.outputs.VERSION }}
          git push origin ${{ steps.version.outputs.VERSION }}
      - name: Create GitHub release
        run: |
          gh release create ${{ steps.version.outputs.VERSION }} \
            --title "Release ${{ steps.version.outputs.VERSION }}" \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
